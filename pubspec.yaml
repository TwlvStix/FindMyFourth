flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.png'
  adaptive_icon_background: '#00000000'
  adaptive_icon_foreground: 'assets/images/adaptive_foreground_icon.png'


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

  fonts:
    - family: 'Gotham'
      fonts:
        - asset: assets/fonts/Gotham-Thin.otf
          weight: 100
        - asset: assets/fonts/Gotham-ThinItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/Gotham-XLight.otf
          weight: 200
        - asset: assets/fonts/Gotham-XLightItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/Gotham-Light.otf
          weight: 300
        - asset: assets/fonts/Gotham-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Gotham-Book.otf
        - asset: assets/fonts/Gotham-BookItalic.otf
          style: italic
        - asset: assets/fonts/Gotham-Medium.otf
          weight: 500
        - asset: assets/fonts/Gotham-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Gotham-Black.otf
          weight: 600
        - asset: assets/fonts/Gotham-BlackItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Gotham-Bold.otf
          weight: 700
        - asset: assets/fonts/Gotham-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Gotham-Ultra.otf
          weight: 900
        - asset: assets/fonts/Gotham-UltraItalic.otf
          weight: 900
          style: italic


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

