name: find_my_fourth
description: Find My Fourth - Golf matchmaking app for the Okanagan Valley

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.1+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  app_settings: ^7.0.0
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1

  cloud_firestore: 6.1.3
  cloud_functions: 6.0.7
  collection: 1.19.1
  connectivity_plus: ^7.0.0
  dropdown_button2: 2.3.9
  easy_debounce: 2.0.3
  file_picker: 10.3.10
  firebase_auth: 6.2.0
  firebase_core: 4.5.0
  firebase_messaging: 16.1.2
  firebase_performance: 0.11.1+5
  firebase_storage: 13.1.0
  flutter_animate: 4.5.2
  flutter_cache_manager: 3.4.1
  flutter_native_splash: 2.4.7
  flutter_plugin_android_lifecycle: 2.0.33
  flutter_spinkit: 5.2.2
  from_css_color: 2.0.0
  go_router: 17.1.0
  google_nav_bar: 5.0.7
  google_sign_in: 7.2.0
  image_cropper: ^11.0.0
  image_picker: 1.2.1
  infinite_scroll_pagination: 5.1.1
  intl: 0.20.2
  mime_type: 1.0.1
  path_provider: 2.1.5
  phosphor_flutter: 2.1.0
  provider: 6.1.5+1
  rxdart: 0.28.0
  shared_preferences: ^2.5.4
  share_plus: ^10.0.0
  sign_in_with_apple: 7.0.1
  stream_transform: 2.1.1

  timeago: 3.7.1
  url_launcher: 6.3.2
  video_player: 2.11.0

  geolocator: ^13.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0
  flutter_local_notifications: ^21.0.0
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3
  firebase_remote_config: ^6.2.0

  crypto: ^3.0.0
  firebase_app_check: ^0.4.1+5
  flutter_app_badger: ^1.5.0
dependency_overrides:
  # http override: firebase_auth transitively requires http ^1.0.0 but some other
  # dependencies pull in older versions causing resolution conflicts. Pin to 1.4.0
  # to ensure consistent behavior across all Firebase packages.
  http: 1.4.0
  # uuid override: Multiple packages depend on different uuid major versions.
  # Pin to ^4.0.0 for compatibility with cloud_firestore and firebase_auth.
  uuid: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_lints: 6.0.0
  image: 4.8.0
  lints: 6.0.0
  test: ^1.24.0
  fake_cloud_firestore: ^4.0.1
  firebase_auth_mocks: ^0.15.1
  flutter_test:
    sdk: flutter
    
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/FM4_V1.png
  remove_alpha_ios: true
  



# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/



  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
